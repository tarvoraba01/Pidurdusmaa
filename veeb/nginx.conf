server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Iga leht on kaustas oma index.html-ina (/rehvid/205-55-r16/index.html).
	# Kaldkriipsuta aadress suunatakse kaldkriipsuga aadressile, et sama
	# leht ei oleks Google'i jaoks kahes kohas.
	location / {
		try_files $uri $uri/index.html $uri/ =404;
	}

	error_page 404 /404.html;

	# Räsinimega varad ei muutu kunagi — võib igavesti puhvrisse jätta.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
	location ~* \.(woff2|jpg|png|svg)$ {
		expires 30d;
		add_header Cache-Control "public";
	}
	# Andmefailid muutuvad korjega — lühem puhver.
	location /data/ {
		expires 1h;
		add_header Cache-Control "public";
	}

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

	add_header X-Content-Type-Options nosniff;
	add_header Referrer-Policy strict-origin-when-cross-origin;
}
